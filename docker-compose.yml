services:
  backend:
    build: ./backend
    ports:
      - "3000:8000"
    env_file:
      - ./backend/.env.docker
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env

  redis:
    image: redis:7-alpine
    ports:
    - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
