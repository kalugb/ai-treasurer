services:
  backend:
    build: ./backend
    # not published on the network: the browser reaches it only through nginx (same origin, so the session cookies stay first-party)
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env.docker
    environment:
      - REDIS_URL=redis://redis:6379/0
      # the address the browser shows; auth callbacks and the CSRF origin check are built from it
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      # true when served over HTTPS (EC2); browsers drop Secure cookies on plain http (except localhost)
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # the first account takes over the pre-auth data; set false on a new deployment
      - CLAIM_LEGACY_USER=${CLAIM_LEGACY_USER:-true}

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
    - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
