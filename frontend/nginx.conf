# frontend/nginx.conf
# The browser only talks to this server (same origin): static files here, /api forwarded to FastAPI.
# That is what keeps the httpOnly session cookies first-party. On EC2, put TLS in front of (or in) this server and
# run the backend with COOKIE_SECURE=true and FRONTEND_URL=https://<your domain>.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # receipt / proof-image uploads (nginx's 1 MB default rejects most photos and PDFs)
    client_max_body_size 12m;

    # Serve files, or fall back to index.html for React Router routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE streams (Drive sync + AI agent): disable buffering so events flush live
    location ~ ^/api/.*/stream$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Forward API calls to FastAPI. No URI after the host, so the /api prefix is kept (the routes are /api/...).
    # X-Forwarded-For is set from $remote_addr, not appended: a client-sent value must not become the login-throttle key.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts hashed build files in /assets, so cache them long-term
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
