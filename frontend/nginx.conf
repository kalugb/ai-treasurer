# frontend/nginx.conf
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve files, or fall back to index.html for React Router routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE streams (Drive sync + AI agent): disable buffering so events flush live
    location ~ /api/.*/stream$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Forward API calls to FastAPI (trailing slash strips /api)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts hashed build files in /assets, so cache them long-term
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}